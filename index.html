<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BetonApp — Sistem Prospek & Order</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  [x-cloak]{display:none!important}
  body{font-family:ui-sans-serif,system-ui,sans-serif}
  .menu-link{display:flex;align-items:center;gap:.75rem;padding:.6rem 1rem;border-radius:.5rem;color:#cbd5e1;transition:.2s;font-size:.9rem;cursor:pointer}
  .menu-link:hover{background:#334155;color:#fff}
  .menu-link.active{background:#2563eb;color:#fff}
  .card{background:#fff;border-radius:.75rem;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid #e2e8f0;padding:1.25rem}
  .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1rem;border-radius:.5rem;font-size:.875rem;font-weight:500;transition:.15s;cursor:pointer;border:none}
  .btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
  .btn-success{background:#059669;color:#fff}.btn-success:hover{background:#047857}
  .btn-danger{background:#dc2626;color:#fff}.btn-danger:hover{background:#b91c1c}
  .btn-warning{background:#f59e0b;color:#fff}.btn-warning:hover{background:#d97706}
  .btn-secondary{background:#e2e8f0;color:#334155}.btn-secondary:hover{background:#cbd5e1}
  .input{width:100%;padding:.5rem .75rem;border:1px solid #cbd5e1;border-radius:.5rem;font-size:.875rem;outline:none;background:#fff}
  .input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  .label{display:block;font-size:.8rem;font-weight:500;color:#334155;margin-bottom:.25rem}
  .badge{display:inline-flex;align-items:center;padding:.2rem .6rem;border-radius:9999px;font-size:.7rem;font-weight:600}
  .th{padding:.6rem .75rem;text-align:left;font-size:.7rem;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
  .td{padding:.6rem .75rem;font-size:.85rem;color:#334155}
  table{width:100%;border-collapse:collapse}
  thead{background:#f8fafc;border-bottom:1px solid #e2e8f0}
  tbody tr{border-bottom:1px solid #f1f5f9}
  tbody tr:hover{background:#f8fafc}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
  .modal-box{background:#fff;border-radius:.75rem;width:100%;max-width:640px;max-height:90vh;overflow-y:auto}
  .dropdown-panel{position:absolute;z-index:20;margin-top:.25rem;width:100%;background:#fff;border:1px solid #cbd5e1;border-radius:.5rem;box-shadow:0 10px 15px -3px rgba(0,0,0,.1);max-height:260px;overflow-y:auto}
  @keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.7)}50%{box-shadow:0 0 0 10px rgba(220,38,38,0)}}
  .animate-pulse-red{animation:pulse-red 1.5s infinite}
  .strikethrough{text-decoration:line-through;text-decoration-color:#dc2626;text-decoration-thickness:2px}
</style>
</head>
<body class="bg-slate-100 text-slate-800">

<div x-data="app()" x-init="init()" x-cloak>

  <!-- LOGIN -->
  <div x-show="!currentUser" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-800 to-blue-900 p-4">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-800">🏗️ BetonApp</h1>
        <p class="text-sm text-slate-500">Sistem Manajemen Prospek & Order</p>
      </div>
      <template x-if="loginError">
        <div class="mb-4 p-2 bg-red-50 text-red-700 rounded text-sm" x-text="loginError"></div>
      </template>
      <div class="space-y-4">
        <div>
          <label class="label">User ID</label>
          <input x-model="loginForm.username" type="text" class="input" placeholder="User ID dari owner"
                 autocomplete="username" @keyup.enter="login()">
        </div>
        <div>
          <label class="label">Password</label>
          <div class="relative">
            <input x-model="loginForm.password" :type="showLoginPw?'text':'password'"
                   class="input pr-10" placeholder="password"
                   autocomplete="current-password" @keyup.enter="login()">
            <button type="button" @click="showLoginPw=!showLoginPw"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700">
              <i :class="showLoginPw?'fa-solid fa-eye-slash':'fa-solid fa-eye'"></i>
            </button>
          </div>
        </div>
        <button @click="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-medium">Login</button>
      </div>
      <div class="mt-6 text-xs text-slate-500 space-y-1 border-t pt-4">
        <p class="font-semibold text-slate-600">Demo Akun:</p>
        <p>Owner : <code class="bg-slate-100 px-1 rounded">owner</code> / password</p>
        <p>Admin : <code class="bg-slate-100 px-1 rounded">admin</code> / password</p>
        <p>Sales : <code class="bg-slate-100 px-1 rounded">sales1</code> / password</p>
        <p>Customer : <code class="bg-slate-100 px-1 rounded">customer</code> / password</p>
      </div>
    </div>
  </div>

  <!-- APP -->
  <template x-if="currentUser">
    <div class="flex min-h-screen">

      <aside :class="sidebarOpen?'w-64':'w-16'" class="bg-slate-800 text-white transition-all duration-200 flex flex-col fixed h-screen z-40">
        <div class="h-16 flex items-center gap-2 px-4 border-b border-slate-700">
          <i class="fa-solid fa-cubes text-blue-400 text-xl"></i>
          <span x-show="sidebarOpen" class="font-bold">BetonApp</span>
        </div>
        <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
          <template x-if="currentUser.role==='customer'">
            <div>
              <div x-show="sidebarOpen" class="text-xs text-slate-500 mt-4 px-2">PROYEK SAYA</div>
              <a @click="nav('jadwal')" :class="page==='jadwal'?'active':''" class="menu-link">
                <i class="fa-solid fa-calendar-days w-5"></i><span x-show="sidebarOpen">Jadwal Pengecoran</span>
              </a>
            </div>
          </template>
          <template x-if="currentUser.role!=='customer'">
            <div>
              <a @click="nav('dashboard')" :class="page==='dashboard'?'active':''" class="menu-link">
                <i class="fa-solid fa-gauge-high w-5"></i><span x-show="sidebarOpen">Dashboard</span>
              </a>
              <div x-show="sidebarOpen" class="text-xs text-slate-500 mt-4 px-2">PROSPEK</div>
              <a @click="nav('inputProspek')" :class="page==='inputProspek'?'active':''" class="menu-link">
                <i class="fa-solid fa-plus-circle w-5"></i><span x-show="sidebarOpen">Input Prospek</span>
              </a>
              <a @click="nav('dataProspek')" :class="page==='dataProspek'?'active':''" class="menu-link">
                <i class="fa-solid fa-list w-5"></i><span x-show="sidebarOpen">Data Prospek</span>
                <template x-if="unreadNotifCount>0">
                  <span class="ml-auto bg-red-500 text-white text-xs rounded-full px-2 py-0.5" x-text="unreadNotifCount"></span>
                </template>
              </a>
              <div x-show="sidebarOpen" class="text-xs text-slate-500 mt-4 px-2">ORDER</div>
              <a @click="nav('inputOrder')" :class="page==='inputOrder'?'active':''" class="menu-link">
                <i class="fa-solid fa-cart-plus w-5"></i><span x-show="sidebarOpen">Input Order</span>
              </a>
              <a @click="nav('orderSearch')" :class="page==='orderSearch'?'active':''" class="menu-link">
                <i class="fa-solid fa-magnifying-glass w-5"></i><span x-show="sidebarOpen">Order Search</span>
              </a>
              <div x-show="sidebarOpen" class="text-xs text-slate-500 mt-4 px-2">PENGIRIMAN</div>
              <a @click="nav('jadwal')" :class="page==='jadwal'?'active':''" class="menu-link">
                <i class="fa-solid fa-calendar-days w-5"></i><span x-show="sidebarOpen">Jadwal Pengecoran</span>
              </a>
              <a @click="nav('afterDelivery')" :class="page==='afterDelivery'?'active':''" class="menu-link">
                <i class="fa-solid fa-truck-fast w-5"></i><span x-show="sidebarOpen">After Delivery</span>
              </a>
            </div>
          </template>
          <template x-if="currentUser.role==='owner'">
            <div>
              <div x-show="sidebarOpen" class="text-xs text-slate-500 mt-4 px-2">OWNER</div>
              <a @click="nav('proposeSiteNo')" :class="page==='proposeSiteNo'?'active':''" class="menu-link">
                <i class="fa-solid fa-file-signature w-5"></i><span x-show="sidebarOpen">Propose Site No</span>
              </a>
              <a @click="nav('kelolaUser')" :class="page==='kelolaUser'?'active':''" class="menu-link">
                <i class="fa-solid fa-users w-5"></i><span x-show="sidebarOpen">Kelola User</span>
              </a>
              <a @click="nav('kelolaPlant')" :class="page==='kelolaPlant'?'active':''" class="menu-link">
                <i class="fa-solid fa-industry w-5"></i><span x-show="sidebarOpen">Kelola Plant</span>
              </a>
              <a @click="nav('kelolaMutu')" :class="page==='kelolaMutu'?'active':''" class="menu-link">
                <i class="fa-solid fa-flask w-5"></i><span x-show="sidebarOpen">Kelola Mutu</span>
              </a>
              <a @click="nav('kelolaKompetitor')" :class="page==='kelolaKompetitor'?'active':''" class="menu-link">
                <i class="fa-solid fa-flag w-5"></i><span x-show="sidebarOpen">Kelola Kompetitor</span>
              </a>
              <a @click="nav('kelolaAlamat')" :class="page==='kelolaAlamat'?'active':''" class="menu-link">
                <i class="fa-solid fa-map-location-dot w-5"></i><span x-show="sidebarOpen">Kelola Alamat</span>
              </a>
              <a @click="nav('logAktivitas')" :class="page==='logAktivitas'?'active':''" class="menu-link">
                <i class="fa-solid fa-clock-rotate-left w-5"></i><span x-show="sidebarOpen">Log Aktivitas</span>
              </a>
            </div>
          </template>
        </nav>
        <div class="p-3 border-t border-slate-700">
          <button @click="logout()" class="menu-link w-full">
            <i class="fa-solid fa-right-from-bracket w-5"></i><span x-show="sidebarOpen">Logout</span>
          </button>
        </div>
      </aside>

      <main :class="sidebarOpen?'ml-64':'ml-16'" class="flex-1 flex flex-col transition-all duration-200 min-h-screen">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 sticky top-0 z-30">
          <div class="flex items-center gap-3">
            <button @click="sidebarOpen=!sidebarOpen" class="text-slate-500 hover:text-slate-800">
              <i class="fa-solid fa-bars"></i>
            </button>
            <h1 class="font-semibold text-slate-800" x-text="pageTitle"></h1>
          </div>
          <div class="flex items-center gap-3">
            <template x-if="currentUser.role==='owner'">
              <button @click="refreshData()" class="btn-secondary text-xs" title="Refresh data">
                <i class="fa-solid fa-rotate"></i> Refresh
              </button>
            </template>
            <template x-if="currentUser.role!=='customer' && unreadNotifCount>0">
              <button @click="nav('dataProspek')" class="btn-danger text-xs animate-pulse-red">
                <i class="fa-solid fa-bell"></i>
                <span x-text="unreadNotifCount + ' Repeat Order'"></span>
              </button>
            </template>
            <button @click="nav('profil')" class="flex items-center gap-2 hover:bg-slate-100 rounded-lg pl-1 pr-3 py-1 transition cursor-pointer border border-transparent hover:border-slate-200" title="Klik untuk buka profil">
              <template x-if="currentUser.avatar">
                <img :src="currentUser.avatar" alt="Avatar" class="w-9 h-9 rounded-full object-cover border-2 border-white shadow-sm">
              </template>
              <template x-if="!currentUser.avatar">
                <div class="w-9 h-9 rounded-full bg-gradient-to-br from-blue-500 to-blue-700 text-white flex items-center justify-center font-bold text-sm shadow-sm" x-text="(currentUser.name||'?').charAt(0).toUpperCase()"></div>
              </template>
              <div class="text-left">
                <div class="text-sm font-medium text-slate-700 leading-tight" x-text="currentUser.name"></div>
                <div class="text-xs text-slate-400 leading-tight" x-text="'@' + (currentUser.username||'-')"></div>
              </div>
            </button>
          </div>
        </header>

        <div class="flex-1 p-6">
          <template x-if="toast">
            <div :class="toastType==='error'?'bg-red-50 text-red-800 border-red-200':'bg-emerald-50 text-emerald-800 border-emerald-200'" class="mb-4 p-3 rounded-lg border text-sm" x-text="toast"></div>
          </template>

          <template x-if="currentUser.role!=='customer' && unreadNotifCount>0">
            <div class="mb-4 p-4 bg-amber-50 border-2 border-amber-300 rounded-lg flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="bg-amber-500 text-white rounded-full w-10 h-10 flex items-center justify-center">
                  <i class="fa-solid fa-bell text-lg"></i>
                </div>
                <div>
                  <p class="font-bold text-amber-900"><span x-text="unreadNotifCount"></span> Permintaan Repeat Order Baru!</p>
                  <p class="text-xs text-amber-700">Segera follow up customer</p>
                </div>
              </div>
              <button @click="nav('dataProspek')" class="btn-warning text-sm"><i class="fa-solid fa-arrow-right"></i> Lihat</button>
            </div>
          </template>

          <!-- DASHBOARD -->
          <div x-show="page==='dashboard' && currentUser.role!=='customer'">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
              <div class="card">
                <div class="flex items-center justify-between">
                  <div><p class="text-sm text-slate-500">Total Prospek</p><p class="text-2xl font-bold" x-text="stats.totalProspek"></p></div>
                  <i class="fa-solid fa-bullseye text-3xl text-blue-500"></i>
                </div>
              </div>
              <div class="card">
                <div class="flex items-center justify-between">
                  <div><p class="text-sm text-slate-500">Repeat Order</p><p class="text-2xl font-bold text-amber-600" x-text="stats.repeatOrder"></p></div>
                  <i class="fa-solid fa-rotate text-3xl text-amber-500"></i>
                </div>
              </div>
              <div class="card">
                <div class="flex items-center justify-between">
                  <div><p class="text-sm text-slate-500">Site No Complete</p><p class="text-2xl font-bold text-indigo-600" x-text="stats.complete"></p></div>
                  <i class="fa-solid fa-certificate text-3xl text-indigo-500"></i>
                </div>
              </div>
              <div class="card">
                <div class="flex items-center justify-between">
                  <div><p class="text-sm text-slate-500">Total Order</p><p class="text-2xl font-bold text-orange-600" x-text="stats.totalOrder"></p></div>
                  <i class="fa-solid fa-cart-shopping text-3xl text-orange-500"></i>
                </div>
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="card"><p class="text-sm text-slate-500">Order Hari Ini</p><p class="text-xl font-bold" x-text="stats.orderToday"></p></div>
              <div class="card"><p class="text-sm text-slate-500">Qty Order (m³)</p><p class="text-xl font-bold" x-text="fmt(stats.qtyOrder)"></p></div>
              <div class="card"><p class="text-sm text-slate-500">Qty Delivered (m³)</p><p class="text-xl font-bold text-emerald-600" x-text="fmt(stats.qtyDelivered)"></p></div>
            </div>
          </div>

          <!-- INPUT PROSPEK -->
          <div x-show="page==='inputProspek' && currentUser.role!=='customer'">
            <div class="max-w-3xl mx-auto card">
              <h2 class="text-lg font-semibold mb-6">Input Prospek Project</h2>
              <form @submit.prevent="saveProspek()" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div class="md:col-span-2"><label class="label">Project Name *</label><input x-model="pForm.project_name" required class="input"></div>
                  <div class="md:col-span-2"><label class="label">Alamat / Lokasi *</label><textarea x-model="pForm.address" required rows="2" class="input"></textarea></div>
                  <div><label class="label">PIC *</label><input x-model="pForm.pic_name" required class="input"></div>
                  <div><label class="label">Kontak PIC *</label><input x-model="pForm.pic_contact" required class="input"></div>
                  <div>
                    <label class="label">Type Konstruksi *</label>
                    <select x-model="pForm.construction_type" required class="input">
                      <option value="">-- Pilih --</option>
                      <template x-for="t in ['Gedung','Jalan','Jembatan','Rumah','Gudang','Pabrik','Lainnya']" :key="t"><option x-text="t" :value="t"></option></template>
                    </select>
                  </div>
                  <div>
                    <label class="label">Kompetitor *</label>
                    <select x-model="pForm.competitor_id" class="input">
                      <option value="">-- Pilih --</option>
                      <template x-for="c in competitors" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
                    </select>
                  </div>
                  <div class="md:col-span-2"><label class="label">Kompetitor Lainnya</label><input x-model="pForm.competitor_other" class="input"></div>
                </div>
                <div class="flex justify-end gap-2">
                  <button type="button" @click="nav('dataProspek')" class="btn-secondary">Batal</button>
                  <button class="btn-primary"><i class="fa-solid fa-save"></i> Save</button>
                </div>
              </form>
            </div>
          </div>

          <!-- DATA PROSPEK -->
          <div x-show="page==='dataProspek' && currentUser.role!=='customer'">
            <div class="card mb-4">
              <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                <input x-model="pFilter.q" placeholder="Cari project..." class="input">
                <select x-model="pFilter.source" class="input">
                  <option value="">Semua Sumber</option>
                  <option value="internal">Internal</option>
                  <option value="customer_repeat">Repeat Order</option>
                </select>
                <select x-model="pFilter.status" class="input">
                  <option value="">Semua Status</option>
                  <option value="waiting">Waiting</option>
                  <option value="propose_site_no">Propose Site No</option>
                  <option value="complete">Complete</option>
                </select>
                <button @click="pFilter.q='';pFilter.status='';pFilter.source=''" class="btn-secondary"><i class="fa-solid fa-rotate-left"></i> Reset Filter</button>
              </div>
            </div>
            <div class="card overflow-x-auto">
              <table>
                <thead>
                  <tr>
                    <th class="th">Project Name</th>
                    <th class="th">Visit</th>
                    <th class="th">Sumber</th>
                    <th class="th">Site No</th>
                    <th class="th">PIC Project</th>
                    <th class="th">Diminta Oleh</th>
                    <th class="th">Status</th>
                    <th class="th">Aksi</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="p in filteredProspek" :key="p.id">
                    <tr :class="(p.source||'internal')==='customer_repeat' && !p.sales_id ? 'bg-amber-50' : ''">
                      <td class="td font-medium" x-text="p.project_name"></td>
                      <td class="td">
                        <template x-if="p.visit_status==='done'">
                          <span class="badge bg-emerald-100 text-emerald-700 cursor-not-allowed opacity-80"
                                title="Visit sudah DONE (Final) — terkunci">
                            <i class="fa-solid fa-lock mr-1"></i><span>DONE</span>
                          </span>
                        </template>
                        <template x-if="p.visit_status!=='done'">
                          <button @click="openVisit(p)" class="badge bg-slate-200 text-slate-600 hover:bg-slate-300" title="Klik untuk isi detail visit">
                            <i class="fa-regular fa-circle mr-1"></i><span>NOT YET</span>
                          </button>
                        </template>
                      </td>
                      <td class="td">
                        <template x-if="(p.source||'internal')==='customer_repeat'"><span class="badge bg-orange-100 text-orange-700"><i class="fa-solid fa-rotate mr-1"></i>Repeat</span></template>
                        <template x-if="(p.source||'internal')!=='customer_repeat'"><span class="badge bg-slate-100 text-slate-600">Internal</span></template>
                      </td>
                      <td class="td">
                        <template x-if="p.site_no"><span class="font-mono text-xs bg-slate-100 px-2 py-1 rounded" x-text="p.site_no"></span></template>
                        <template x-if="!p.site_no"><span class="text-yellow-600 text-xs">waiting</span></template>
                      </td>
                      <td class="td" x-text="p.pic_name||'-'"></td>
                      <td class="td text-xs">
                        <template x-if="p.requested_by_name"><span class="text-blue-700 font-medium"><i class="fa-solid fa-user mr-1"></i><span x-text="p.requested_by_name"></span></span></template>
                        <template x-if="!p.requested_by_name"><span class="text-slate-400">-</span></template>
                      </td>
                      <td class="td">
                        <template x-if="(p.source||'internal')==='customer_repeat' && !p.sales_id"><span class="badge bg-amber-200 text-amber-800"><i class="fa-solid fa-hourglass-half mr-1"></i>Perlu Follow Up</span></template>
                        <template x-if="(p.source||'internal')==='customer_repeat' && p.sales_id"><span class="badge bg-emerald-100 text-emerald-700"><i class="fa-solid fa-check mr-1"></i>Diambil Sales</span></template>
                        <template x-if="(p.source||'internal')!=='customer_repeat'">
                          <template x-if="(p.site_no_status||'waiting')==='waiting'"><span class="badge bg-yellow-100 text-yellow-700">Waiting</span></template>
                          <template x-if="(p.site_no_status||'waiting')==='propose_site_no'"><span class="badge bg-blue-100 text-blue-700">Propose Site No</span></template>
                          <template x-if="(p.site_no_status||'waiting')==='complete'"><span class="badge bg-emerald-100 text-emerald-700">✅ Complete</span></template>
                        </template>
                      </td>
                      <td class="td">
                        <div class="flex gap-2 items-center">
                          <template x-if="p.site_no_status==='complete' && p.site_no">
                            <a @click="goOrder(p)" class="text-blue-600 hover:underline text-xs cursor-pointer whitespace-nowrap"><i class="fa-solid fa-cart-plus"></i> Buat Order</a>
                          </template>
                          <template x-if="(p.source||'internal')==='customer_repeat'">
                            <button @click="showRequestDetail(p)" class="text-amber-600 hover:underline text-xs whitespace-nowrap"><i class="fa-solid fa-eye"></i> Detail</button>
                          </template>

  <!-- MODAL: PROPOSE SITE NO -->
  <template x-if="propModal.show">

  <template x-if="editOrderModal.show">

      <div class="modal-box" style="max-width:680px">
        <div class="p-4 border-b flex justify-between items-center sticky top-0 bg-white">
          <h3 class="font-semibold">Edit Order — <span class="text-blue-600" x-text="editOrderModal.data.order_no"></span></h3>

        </div>
        <form @submit.prevent="saveEditOrder()" class="p-4 space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="label">Mutu *</label>
              <select x-model="eoForm.mutu_id" required class="input">
                <option value="">-- Pilih --</option>
                <template x-for="m in mutuList" :key="m.id"><option :value="m.id" x-text="`${m.code} — ${m.name}`"></option></template>
              </select>

            <div>
              <label class="label">Plant *</label>
              <select x-model="eoForm.plant_id" required class="input">
                <template x-for="p in plants" :key="p.id"><option :value="p.id" x-text="p.name"></option></template>
              </select>

            <div><label class="label">Delivery Date</label><input type="date" x-model="eoForm.delivery_date" class="input"></div>

              <select x-model="eoForm.metode_cor" class="input">
                <option value="">-- Pilih --</option>

          <div class="border-t pt-3">

            <select x-model="eoForm.status" class="input">
              <option value="pending">Pending</option>
              <option value="scheduled">Scheduled</option>
              <option value="partial">Partial</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <template x-if="editOrderModal.data.cancel_reason">
            <div class="bg-red-50 border border-red-200 rounded-lg p-3 text-xs">
              <span class="text-red-700 font-semibold">Order sudah dibatalkan.</span>
              <div class="text-red-600 italic mt-1">Alasan: <span x-text="editOrderModal.data.cancel_reason"></span></div>
            </div>
          </template>
          <div class="flex justify-between gap-2 pt-3 border-t">
            <template x-if="editOrderModal.data.status!=='cancelled'">
              <button type="button" @click="cancelOrderFromEdit()" class="btn-danger">
                <i class="fa-solid fa-ban"></i> Cancel Order
              </button>
            </template>
            <template x-if="editOrderModal.data.status==='cancelled'">
              <span class="text-red-600 text-sm"><i class="fa-solid fa-ban"></i> Order sudah cancelled</span>
            </template>
            <div class="flex gap-2 ml-auto">
              <button type="button" @click="editOrderModal.show=false" class="btn-secondary">Batal</button>
              <button class="btn-success" :disabled="editOrderModal.data.status==='cancelled'"><i class="fa-solid fa-save"></i> Save</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </template>

<script>
const DB = {
  get: (k, def=[]) => JSON.parse(localStorage.getItem('beton_'+k) || JSON.stringify(def)),
  set: (k, v) => localStorage.setItem('beton_'+k, JSON.stringify(v)),
  nextId: (k) => {
    const arr = DB.get(k);
    return arr.length ? Math.max(...arr.map(x=>+x.id))+1 : 1;
  }
};
const todayISO = () => new Date().toISOString().slice(0,10);

const DEFAULT_USERS = [
  { id:1, username:'owner',    name:'Owner Utama',    email:'owner@app.com',    password:'password', role:'owner',    plant_id:null, is_active:true },
  { id:2, username:'admin',    name:'Admin Satu',     email:'admin@app.com',    password:'password', role:'admin',    plant_id:null, is_active:true },
  { id:3, username:'sales1',   name:'Rina Sales',     email:'sales1@app.com',   password:'password', role:'sales',    plant_id:null, is_active:true },
  { id:4, username:'sales2',   name:'Dodi Sales',     email:'sales2@app.com',   password:'password', role:'sales',    plant_id:null, is_active:true },
  { id:5, username:'customer', name:'Customer Demo',  email:'customer@app.com', password:'password', role:'customer', assigned_sites:[], is_active:true },
];

function app() {
  return {
    sidebarOpen: true,
    page: 'dashboard',
    toast: '', toastType: 'success',
    loginError: '',
    loginForm: { username:'', password:'' },
    showLoginPw: false, showUserPw: false, showOldPw: false, showNewPw: false, showConfirmPw: false, showEditUserPw: false,
    pwVisible: {},
    currentUser: null,
    users: [], plants: [], mutuList: [], competitors: [], addresses: [],
    prospects: [], orders: [], deliveries: [], visits: [], notifications: [],
    loginLogs: [],
    logFilter: { q:'', status:'' },
    profileForm: { old_password:'', new_password:'', confirm_password:'' },

    pForm: { project_name:'',address:'',pic_name:'',pic_contact:'',construction_type:'',competitor_id:'',competitor_other:'' },
    pFilter: { q:'',visit:'',status:'',source:'' },
    oForm: { site_no:'',project_name:'',address:'',po_no:'',pic_name:'',pic_contact:'',mutu_id:'',plant_id:'',delivery_date:'',pouring_time:'',qty_order:0,metode_cor:'',mutu_list:[] },
    jFilter: { plants:[],status:'',date_from:'',date_to:'' },
    sFilter: { q:'',plant_id:'',mutu_id:'',status:'' },
    adFilter: { q:'',date_from:'',date_to:'',status:'' },
    psFilter: { q:'', status:'' },

    visitModal: { show:false, id:null, project_name:'', current_status:'not_yet' },
    vForm: { estimasi_tgl_cor:'',jam_loading:'',mutu_id:'',estimasi_volume:0,plant_id:'',metode_cor:'',win:false,lost:false },

    dvModal: { show:false, order_id:null, site_no:'', remain:0, order_no:'', order_delivery_date:'' },
    dvForm: { sj_no:'', delivery_date:'', truck_no:'', qty:0, driver_name:'' },

    editDvModal: { show:false, deliveryId:null, order_no:'', delivery_date:'' },
    edvForm: { status:'delivered', remarks:'', sj_no:'', truck_no:'', qty:0, driver_name:'' },

    editOrderModal: { show:false, data:{} },
    eoForm: { mutu_id:'', plant_id:'', delivery_date:'', pouring_time:'', qty_order:0, metode_cor:'', status:'' },
    orderDetailModal: { show:false, data:null },

    propModal: { show:false, data:{} },
    propForm: { site_no:'',po_no:'',mutu:[] },

    ocModal: { show:false, data:null, mode:'new' },
    ocForm: { site_no:'', delivery_date:'', pouring_time:'', qty_order:0, metode_cor:'', note:'' },
    reqModal: { show:false, data:null },

    uForm: { username:'',name:'',email:'',password:'',role:'',plant_id:'',assigned_sites:[] },
    editUserModal: { show:false, userId:null },
    euForm: { username:'',name:'',email:'',password:'',role:'',plant_id:'',assigned_sites:[],is_active:true,avatar:null },

    plForm:{ code:'',name:'',address:'',phone:'' },
    mForm:{ code:'',name:'',slump:'',price:0 },
    cForm:{ name:'',address:'',contact_person:'',phone:'' },
    aForm:{ label:'',address:'',city:'',province:'',type:'site' },

    editPlantModal: { show:false, id:null }, epForm:{ code:'',name:'',address:'',phone:'' },
    editMutuModal: { show:false, id:null }, emForm:{ code:'',name:'',slump:'',price:0 },
    editKompetitorModal: { show:false, id:null }, ecForm:{ name:'',address:'',contact_person:'',phone:'' },
    editAlamatModal: { show:false, id:null }, eaForm:{ label:'',address:'',city:'',province:'',type:'site' },

    init() {
      if (!localStorage.getItem('beton_users')) this.seed();
      this.ensureDefaultUsers();
      this.reload();
      this.normalizeData();
      const saved = localStorage.getItem('beton_current');
      if (saved) {
        const parsed = JSON.parse(saved);
        const found = this.users.find(u => u.email === parsed.email || u.username === parsed.username);
        if (found) { this.currentUser = found; if (found.role === 'customer') this.page = 'jadwal'; }
        else localStorage.removeItem('beton_current');
      }
      this.adFilter.date_from = todayISO(); this.adFilter.date_to = todayISO();
      this.jFilter.date_from = todayISO(); this.jFilter.date_to = todayISO();
    },

    refreshData() {
      this.reload();
      this.normalizeData();
      this.toastMsg('Data berhasil di-refresh');
    },

    ensureDefaultUsers() {
      const list = DB.get('users');
      let changed = false;
      DEFAULT_USERS.forEach(def => {
        const exist = list.find(u => (u.email && u.email === def.email) || (u.username && u.username === def.username));
        if (!exist) { list.push({ ...def, id: list.length ? Math.max(...list.map(u=>+u.id))+1 : def.id }); changed = true; }
        else if (!exist.username) { exist.username = def.username || (exist.email ? exist.email.split('@')[0] : ''); changed = true; }
      });
      list.forEach(u => {
        if (!u.username) { u.username = (u.email || '').split('@')[0] || ('user' + u.id); changed = true; }
        if (!u.role) { u.role = 'sales'; changed = true; }
        if (u.role === 'customer' && !Array.isArray(u.assigned_sites)) { u.assigned_sites = []; changed = true; }
        if (typeof u.is_active === 'undefined') { u.is_active = true; changed = true; }
      });
      if (changed) DB.set('users', list);
    },

    seed() {
      DB.set('users', JSON.parse(JSON.stringify(DEFAULT_USERS)));
      DB.set('plants', [
        { id:1, code:'PL01', name:'Plant A', address:'Jl. Industri 1', phone:'021-111', is_active:1 },
        { id:2, code:'PL02', name:'Plant B', address:'Jl. Industri 2', phone:'021-222', is_active:1 },
      ]);
      DB.set('mutu', [
        { id:1, code:'K-175', name:'Beton K-175', slump:'12±2', price:700000 },
        { id:2, code:'K-225', name:'Beton K-225', slump:'12±2', price:820000 },
        { id:3, code:'K-250', name:'Beton K-250', slump:'12±2', price:870000 },
        { id:4, code:'K-300', name:'Beton K-300', slump:'12±2', price:920000 },
        { id:5, code:'K-350', name:'Beton K-350', slump:'12±2', price:980000 },
      ]);
      DB.set('competitors', [
        { id:1, name:'PT Beton Jaya', phone:'0811' },
        { id:2, name:'PT Sinar Beton', phone:'0812' },
      ]);
      DB.set('addresses', []);
      DB.set('prospects', []); DB.set('orders', []); DB.set('deliveries', []);
      DB.set('visits', []); DB.set('propose', []); DB.set('notifications', []); DB.set('login_logs', []);
    },

    reload() {
      this.users = DB.get('users'); this.plants = DB.get('plants');
      this.mutuList = DB.get('mutu'); this.competitors = DB.get('competitors');
      this.addresses = DB.get('addresses'); this.prospects = DB.get('prospects');
      this.orders = DB.get('orders'); this.deliveries = DB.get('deliveries');
      this.visits = DB.get('visits'); this.notifications = DB.get('notifications');
      this.loginLogs = DB.get('login_logs');
    },

    normalizeData() {
      const fixId = v => (v === '' || v === null || v === undefined || v === 'null') ? null : Number(v);
      let fixed = 0;
      ['orders','prospects','deliveries','visits','propose','users','notifications'].forEach(tbl => {
        const list = DB.get(tbl);
        list.forEach(item => {
          ['mutu_id','plant_id','sales_id','sales_visit_id','prospect_id','order_id','competitor_id','created_by','requested_by'].forEach(k => {
            if (k in item) { const before = item[k]; const after = fixId(before); if (before !== after) { item[k] = after; fixed++; } }
          });
          if (tbl === 'prospects') {
            if (!item.source) { item.source = 'internal'; fixed++; }
            if (!item.site_no_status) { item.site_no_status = 'waiting'; fixed++; }
            if (!item.visit_status) { item.visit_status = 'not_yet'; fixed++; }
          }
          if (tbl === 'deliveries') {
            if (!item.status) { item.status = 'delivered'; fixed++; }
            if (typeof item.remarks === 'undefined') { item.remarks = ''; fixed++; }
          }
        });
        DB.set(tbl, list);
      });
      if (fixed > 0) this.reload();
    },

    fmt(n) { return (Number(n)||0).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2}); },
    nowStr() { return new Date().toLocaleString('id-ID'); },
    fmtDate(s) {
      if (!s) return '-';
      const d = new Date(s);
      return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    },
    toastMsg(m, type='success') { this.toast = m; this.toastType = type; setTimeout(()=>this.toast='',3000); },
    nav(page) { this.page = page; this.toast=''; },

    salesName(id) { return this.users.find(u=>Number(u.id)===Number(id))?.name || '-'; },
    plantName(id) { return this.plants.find(p=>Number(p.id)===Number(id))?.name || '-'; },
    mutuCode(id) { return this.mutuList.find(m=>Number(m.id)===Number(id))?.code || '-'; },
    orderById(id) { return this.orders.find(o=>Number(o.id)===Number(id)); },
    hasDelivery(orderId) { return this.deliveries.some(d => Number(d.order_id) === Number(orderId)); },

    statusBadge(s) {
      return {
        pending:'bg-slate-100 text-slate-700', scheduled:'bg-blue-100 text-blue-700',
        partial:'bg-yellow-100 text-yellow-700', completed:'bg-emerald-100 text-emerald-700',
        cancelled:'bg-red-100 text-red-700 line-through',
      }[s] || 'bg-slate-100';
    },
    roleBadge(r) {
      return {
        owner:'bg-purple-100 text-purple-700', admin:'bg-blue-100 text-blue-700',
        sales:'bg-emerald-100 text-emerald-700', logistik:'bg-yellow-100 text-yellow-700',
        customer:'bg-orange-100 text-orange-700',
      }[r] || 'bg-slate-100 text-slate-700';
    },

    get isCustomer() { return this.currentUser?.role === 'customer'; },
    get unreadNotifCount() {
      if (!this.currentUser || this.currentUser.role === 'customer') return 0;
      return this.notifications.filter(n => !(n.read_by || []).includes(this.currentUser.id)).length;
    },
    get accessibleSites() {
      const u = this.currentUser;
      if (!u) return [];
      if (u.role === 'owner' || u.role === 'admin') return null;
      if (u.role === 'customer') return u.assigned_sites || [];
      if (u.role === 'sales') return this.prospects.filter(p => Number(p.sales_id) === Number(u.id)).map(p => p.site_no).filter(Boolean);
      return [];
    },
    get pageTitle() {
      return {
        dashboard:'Dashboard', inputProspek:'Input Prospek Project', dataProspek:'Data Project Prospek',
        inputOrder:'Input Order', jadwal:'Jadwal Pengecoran', orderSearch:'Order Search',
        afterDelivery:'After Delivery Report', proposeSiteNo:'Propose Site No',
        kelolaUser:'Kelola User', kelolaPlant:'Kelola Plant', kelolaMutu:'Kelola Mutu',
        kelolaKompetitor:'Kelola Kompetitor', kelolaAlamat:'Kelola Alamat',
        profil:'Profil Saya', logAktivitas:'Log Aktivitas User',
      }[this.page] || '';
    },
    get filteredLogs() {
      let list = (this.loginLogs || []).slice();
      if (this.logFilter.q) {
        const q = this.logFilter.q.toLowerCase();
        list = list.filter(l => (l.username||'').toLowerCase().includes(q) || (l.name||'').toLowerCase().includes(q));
      }
      if (this.logFilter.status) list = list.filter(l => l.status === this.logFilter.status);
      return list;
    },
    get filteredProposals() {
      const propose = DB.get('propose');
      return this.prospects
        .filter(p => ['propose_site_no','complete'].includes(p.site_no_status||''))
        .map(p => {
          const pr = propose.find(x => Number(x.prospect_id) === Number(p.id));
          return { ...p, propose_date: pr?.created_at || p.visit_done_at || p.created_at };
        })
        .filter(p => {
          if (this.psFilter.status && p.site_no_status !== this.psFilter.status) return false;
          if (this.psFilter.q) {
            const q = this.psFilter.q.toLowerCase();
            return (p.project_name||'').toLowerCase().includes(q) || (p.site_no||'').toLowerCase().includes(q) || (p.pic_name||'').toLowerCase().includes(q);
          }
          return true;
        })
        .sort((a,b)=> b.id - a.id);
    },

    resetJadwalFilter() { this.jFilter = { plants:[], status:'', date_from: todayISO(), date_to: todayISO() }; },
    resetAdFilter() { this.adFilter = { q:'', date_from: todayISO(), date_to: todayISO(), status:'' }; },

    login() {
      const uid = (this.loginForm.username || '').trim().toLowerCase();
      if (!uid) { this.loginError = 'User ID wajib diisi'; return; }
      const u = this.users.find(x => ((x.username && x.username.toLowerCase() === uid) || (x.email && x.email.toLowerCase() === uid)));
      if (!u || u.password !== this.loginForm.password) {
        this.loginError = 'User ID / password salah';
        this.recordLogin(null, uid, 'failed');
        return;
      }
      if (u.is_active === false) {
        this.loginError = 'Akun Anda dinonaktifkan. Hubungi owner.';
        this.recordLogin(u, uid, 'inactive');
        return;
      }
      this.currentUser = u;
      localStorage.setItem('beton_current', JSON.stringify(u));
      this.loginError = '';
      this.loginForm = { username:'', password:'' };
      this.recordLogin(u, uid, 'success');
      this.nav(u.role === 'customer' ? 'jadwal' : 'dashboard');
      this.toastMsg('Selamat datang, ' + u.name);
    },

    recordLogin(user, uidInput, status) {
      const logs = DB.get('login_logs');
      logs.unshift({
        id: logs.length ? Math.max(...logs.map(l=>+l.id))+1 : 1,
        user_id: user?.id || null, username: user?.username || uidInput,
        name: user?.name || '(tidak dikenal)', role: user?.role || '-', status,
        login_at: new Date().toISOString(),
        user_agent: (navigator.userAgent || '').slice(0, 100),
      });
      if (logs.length > 500) logs.length = 500;
      DB.set('login_logs', logs);
    },

    uploadAvatar(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      if (file.size > 500 * 1024) { this.toastMsg('File terlalu besar. Maks 500 KB.','error'); event.target.value = ''; return; }
      if (!file.type.startsWith('image/')) { this.toastMsg('File harus berupa gambar.','error'); event.target.value = ''; return; }
      const reader = new FileReader();
      reader.onload = (e) => {
        const list = DB.get('users');
        const i = list.findIndex(u => Number(u.id) === Number(this.currentUser.id));
        if (i < 0) return;
        list[i].avatar = e.target.result;
        DB.set('users', list);
        this.currentUser = list[i];
        localStorage.setItem('beton_current', JSON.stringify(list[i]));
        this.reload();
        this.toastMsg('Foto profil berhasil diupdate');
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    },

    removeAvatar() {
      if (!confirm('Hapus foto profil?')) return;
      const list = DB.get('users');
      const i = list.findIndex(u => Number(u.id) === Number(this.currentUser.id));
      if (i < 0) return;
      delete list[i].avatar;
      DB.set('users', list);
      this.currentUser = list[i];
      localStorage.setItem('beton_current', JSON.stringify(list[i]));
      this.reload();
      this.toastMsg('Foto profil dihapus');
    },

    changeMyPassword() {
      if (this.profileForm.new_password !== this.profileForm.confirm_password) { this.toastMsg('Konfirmasi password tidak sama','error'); return; }
      if ((this.profileForm.new_password||'').length < 6) { this.toastMsg('Password minimal 6 karakter','error'); return; }
      if (this.profileForm.old_password !== this.currentUser.password) { this.toastMsg('Password lama salah','error'); return; }
      const list = DB.get('users');
      const i = list.findIndex(u => Number(u.id) === Number(this.currentUser.id));
      if (i < 0) return;
      list[i].password = this.profileForm.new_password;
      DB.set('users', list);
      this.currentUser = list[i];
      localStorage.setItem('beton_current', JSON.stringify(list[i]));
      this.profileForm = { old_password:'', new_password:'', confirm_password:'' };
      this.reload();
      this.toastMsg('Password berhasil diubah!');
    },

    togglePwVisible(id) { this.pwVisible = { ...this.pwVisible, [id]: !this.pwVisible[id] }; },
    toggleUserActive(id) {
      const list = DB.get('users');
      const i = list.findIndex(u => Number(u.id) === Number(id));
      if (i < 0) return;
      if (Number(list[i].id) === Number(this.currentUser.id)) { this.toastMsg('Tidak bisa nonaktifkan akun sendiri','error'); return; }
      list[i].is_active = list[i].is_active === false ? true : false;
      DB.set('users', list);
      this.reload();
      this.toastMsg('User "' + list[i].username + '" ' + (list[i].is_active ? 'diaktifkan' : 'dinonaktifkan'));
    },
    logout() { this.currentUser = null; localStorage.removeItem('beton_current'); },

    get stats() {
      const u = this.currentUser;
      let myProspek = this.prospects.slice();
      let myOrders = this.orders.slice();
      if (u?.role === 'sales') {
        myProspek = myProspek.filter(p=>Number(p.sales_id)===Number(u.id));
        myOrders = myOrders.filter(o=>Number(o.sales_id)===Number(u.id));
      }
      const today = todayISO();
      return {
        totalProspek: myProspek.length,
        repeatOrder: myProspek.filter(p=>p.source === 'customer_repeat').length,
        visitDone: myProspek.filter(p=>p.visit_status==='done').length,
        complete: myProspek.filter(p=>p.site_no_status==='complete').length,
        totalOrder: myOrders.length,
        orderToday: myOrders.filter(o=>o.delivery_date===today).length,
        qtyOrder: myOrders.reduce((s,o)=>s+(+o.qty_order||0),0),
        qtyDelivered: myOrders.reduce((s,o)=>s+(+o.qty_delivery||0),0),
      };
    },

    saveProspek() {
      const list = DB.get('prospects');
      const yy = new Date().toISOString().slice(0,7).replace('-','');
      const no = `PRS/${yy}/${String(list.length+1).padStart(4,'0')}`;
      const comp = this.competitors.find(c=>Number(c.id)===Number(this.pForm.competitor_id));
      list.push({
        id: DB.nextId('prospects'), prospect_no: no,
        project_name: this.pForm.project_name, address: this.pForm.address,
        pic_name: this.pForm.pic_name, pic_contact: this.pForm.pic_contact,
        construction_type: this.pForm.construction_type,
        competitor_id: comp?Number(comp.id):null,
        competitor_name: comp?.name || this.pForm.competitor_other || '',
        sales_id: this.currentUser.id, sales_visit_id: null,
        site_no: null, site_no_status: 'waiting', po_no: null,
        visit_status: 'not_yet', final_status: 'open',
        source: 'internal', created_at: new Date().toISOString(),
      });
      DB.set('prospects', list);
      this.reload();
      this.pForm = { project_name:'',address:'',pic_name:'',pic_contact:'',construction_type:'',competitor_id:'',competitor_other:'' };
      this.toastMsg('Prospek disimpan: '+no);
      this.nav('dataProspek');
    },

    get filteredProspek() {
      const u = this.currentUser;
      const allowed = this.accessibleSites;
      return this.prospects
        .filter(p => {
          if (u?.role === 'sales') return Number(p.sales_id) === Number(u.id) || (p.source === 'customer_repeat' && !p.sales_id);
          if (u?.role === 'customer') return allowed.includes(p.site_no);
          return true;
        })
        .filter(p => !this.pFilter.q || p.project_name.toLowerCase().includes(this.pFilter.q.toLowerCase()))
        .filter(p => !this.pFilter.visit || p.visit_status === this.pFilter.visit)
        .filter(p => !this.pFilter.status || p.site_no_status === this.pFilter.status)
        .filter(p => !this.pFilter.source || (p.source||'internal') === this.pFilter.source)
        .sort((a,b)=> b.id - a.id);
    },

    openVisit(p) {
      const v = this.visits.find(x=>Number(x.prospect_id)===Number(p.id)) || {};
      this.visitModal = { show:true, id:p.id, project_name:p.project_name, current_status: p.visit_status || 'not_yet' };
      this.vForm = {
        estimasi_tgl_cor: v.estimasi_tgl_cor||'', jam_loading: v.jam_loading||'',
        mutu_id: v.mutu_id||'', estimasi_volume: v.estimasi_volume||0,
        plant_id: v.plant_id||'', metode_cor: v.metode_cor||'',
        win: !!v.win, lost: !!v.lost,
      };
    },

    saveVisit() {
      const list = DB.get('visits');
      const idx = list.findIndex(v=>Number(v.prospect_id)===Number(this.visitModal.id));
      const data = {
        id: idx>=0 ? list[idx].id : DB.nextId('visits'),
        prospect_id: this.visitModal.id,
        estimasi_tgl_cor: this.vForm.estimasi_tgl_cor, jam_loading: this.vForm.jam_loading,
        mutu_id: this.vForm.mutu_id ? Number(this.vForm.mutu_id) : null,
        estimasi_volume: this.vForm.estimasi_volume,
        plant_id: this.vForm.plant_id ? Number(this.vForm.plant_id) : null,
        metode_cor: this.vForm.metode_cor,
        win: this.vForm.win, lost: this.vForm.lost,
        created_by: this.currentUser?.id,
      };
      if (idx>=0) list[idx]=data; else list.push(data);
      DB.set('visits', list);
      const ps = DB.get('prospects');
      const pi = ps.findIndex(p=>Number(p.id)===Number(this.visitModal.id));
      if (pi>=0) {
        ps[pi].visit_status = 'done';
        ps[pi].visit_done_at = new Date().toISOString();
        ps[pi].sales_visit_id = this.currentUser?.id;
        if (ps[pi].site_no_status === 'waiting') ps[pi].site_no_status = 'propose_site_no';
      }
      DB.set('prospects', ps);
      this.reload();
      this.visitModal.show = false;

    claimProspek(p) {
      if (!this.currentUser?.id) return;
      const list = DB.get('prospects');
      const i = list.findIndex(x => Number(x.id) === Number(p.id));
      if (i < 0) return;
      list[i].sales_id = this.currentUser.id;
      list[i].final_status = 'follow_up';
      DB.set('prospects', list);
      const notifs = DB.get('notifications');
      notifs.forEach(n => { if (Number(n.prospect_id) === Number(p.id)) n.read_by = [...(n.read_by || []), this.currentUser.id]; });
      DB.set('notifications', notifs);
      this.reload();
      this.toastMsg('Prospek diambil!');
    },

    deleteProspect(p) {
      if (!this.currentUser || this.currentUser.role !== 'owner') {
        this.toastMsg('Hanya Owner yang bisa menghapus prospek','error'); return;
      }
      const relatedOrders = DB.get('orders').filter(o => Number(o.prospect_id) === Number(p.id));
      let msg = 'Hapus prospek "' + p.project_name + '" (' + (p.prospect_no||'-') + ')?';
      if (relatedOrders.length > 0) {
        msg += '\n\n⚠️ Prospek ini memiliki ' + relatedOrders.length + ' order terkait.\nOrder & delivery juga akan dihapus.';
      }
      if (!confirm(msg)) return;

      DB.set('prospects', DB.get('prospects').filter(x => Number(x.id) !== Number(p.id)));
      DB.set('visits', DB.get('visits').filter(v => Number(v.prospect_id) !== Number(p.id)));
      DB.set('propose', DB.get('propose').filter(pr => Number(pr.prospect_id) !== Number(p.id)));
      if (relatedOrders.length > 0) {
        const orderIds = relatedOrders.map(o => Number(o.id));
        DB.set('orders', DB.get('orders').filter(o => !orderIds.includes(Number(o.id))));
        DB.set('deliveries', DB.get('deliveries').filter(d => !orderIds.includes(Number(d.order_id))));
      }
      DB.set('notifications', DB.get('notifications').filter(n => Number(n.prospect_id) !== Number(p.id)));

      this.reload();
      this.toastMsg('Prospek "' + p.project_name + '" berhasil dihapus');
    },

    showRequestDetail(p) {
      this.reqModal = { show:true, data:p };
      const notifs = DB.get('notifications');
      notifs.forEach(n => {
        if (Number(n.prospect_id) === Number(p.id) && !(n.read_by || []).includes(this.currentUser.id)) {
          n.read_by = [...(n.read_by || []), this.currentUser.id];
        }
      });
      DB.set('notifications', notifs);
      this.reload();
    },

    get customerSites() {
      const u = this.currentUser;
      if (!u || u.role !== 'customer') return [];
      const sites = u.assigned_sites || [];
      const map = {};
      this.prospects.filter(p => sites.includes(p.site_no)).forEach(p => { if (!map[p.site_no]) map[p.site_no] = p; });
      return Object.values(map);

        requested_by: customer.id, requested_by_name: customer.name,

    goOrder(p) { this.nav('inputOrder'); this.oForm.site_no = p.site_no; this.onSiteChange(); },
    get completeSites() { return this.prospects.filter(p=>p.site_no_status==='complete' && p.source !== 'customer_repeat'); },
    get siteFound() { return this.completeSites.some(s => s.site_no === this.oForm.site_no); },

      this.toastMsg('Order dibuat');
      this.nav('jadwal');

    get groupedOrders() {
      const u = this.currentUser;
      if (!u) return [];
      const allowed = this.accessibleSites;
      let list = this.orders.slice();
      if (u.role === 'sales') list = list.filter(o=>Number(o.sales_id)===Number(u.id));
      if (u.role === 'customer') list = list.filter(o=>allowed.includes(o.site_no));
      if (this.jFilter.plants.length) list = list.filter(o=>this.jFilter.plants.map(Number).includes(Number(o.plant_id)));
      if (this.jFilter.status) list = list.filter(o=>o.status===this.jFilter.status);
      if (this.jFilter.date_from) list = list.filter(o=>o.delivery_date>=this.jFilter.date_from);
      if (this.jFilter.date_to) list = list.filter(o=>o.delivery_date<=this.jFilter.date_to);
      list = list.map(o=>({ ...o, deliveries: this.deliveries.filter(d=>Number(d.order_id)===Number(o.id)) }));
      list.sort((a,b)=> (a.delivery_date+a.pouring_time).localeCompare(b.delivery_date+b.pouring_time));
      const map = {};
      list.forEach(o=>{
        const key = this.plantName(o.plant_id) || '-';
        if (!map[key]) map[key] = { plant:key, orders:[] };
        map[key].orders.push(o);
      });
      return Object.values(map);
    },

    // Hitung ulang qty_delivery dari delivery yang status 'delivered'
    recalcOrderStatus(orderId) {
      const oList = DB.get('orders');
      const oi = oList.findIndex(x => Number(x.id) === Number(orderId));
      if (oi < 0) return;
      const order = oList[oi];
      const activeDeliv = DB.get('deliveries').filter(d =>
        Number(d.order_id) === Number(orderId) && (d.status || 'delivered') === 'delivered'
      );
      const total = activeDeliv.reduce((s,d) => s + (+d.qty || 0), 0);
      const remain = order.qty_order - total;
      let status = order.status;
      if (status !== 'cancelled') {
        status = total <= 0 ? 'scheduled' : (remain <= 0 ? 'completed' : 'partial');
      }
      oList[oi] = { ...order, qty_delivery: total, qty_remain: remain, status };
      DB.set('orders', oList);
    },

    openDelivery(o) {
      this.dvModal = {
        show: true, order_id: o.id, site_no: o.site_no, remain: o.qty_remain,
        order_no: o.order_no, order_delivery_date: o.delivery_date,
      };
      this.dvForm = {
        sj_no: '',
        delivery_date: o.delivery_date,
        truck_no: '',
        qty: 0,
        driver_name: '',
      };
    },

    saveDelivery() {
      const o = this.orders.find(x=>Number(x.id)===Number(this.dvModal.order_id));
      if (!o) return;
      if (+this.dvForm.qty > o.qty_remain) { this.toastMsg('Muatan melebihi sisa','error'); return; }

      const sjNo = (this.dvForm.sj_no || '').trim();
      if (sjNo) {
        const dupe = DB.get('deliveries').find(d => (d.sj_no||'').toLowerCase() === sjNo.toLowerCase());
        if (dupe) { this.toastMsg('No SJ sudah dipakai. Gunakan nomor lain.','error'); return; }
      }

      const dList = DB.get('deliveries');
      dList.push({
        id: DB.nextId('deliveries'), order_id: o.id,
        sj_no: sjNo || null,
        delivery_date: o.delivery_date,
        truck_no: this.dvForm.truck_no,
        qty: +this.dvForm.qty,
        driver_name: this.dvForm.driver_name,
        status: 'delivered',
        remarks: '',
        created_by: this.currentUser?.id,
        created_at: new Date().toISOString(),
      });
      DB.set('deliveries', dList);
      this.recalcOrderStatus(o.id);
      this.reload();
      this.dvModal.show = false;
      this.toastMsg('Delivery disimpan' + (sjNo ? '. No SJ: ' + sjNo : ' (tanpa No SJ).'));
    },

    openEditDelivery(d) {
      this.editDvModal = {
        show: true, deliveryId: d.id,
        order_no: this.orderById(d.order_id)?.order_no || '-',
        delivery_date: d.delivery_date,
      };
      this.edvForm = {
        status: d.status || 'delivered',
        remarks: d.remarks || '',
        sj_no: d.sj_no || '',
        truck_no: d.truck_no || '',
        qty: d.qty || 0,
        driver_name: d.driver_name || '',
      };
    },

    saveEditDelivery() {
      const dList = DB.get('deliveries');
      const i = dList.findIndex(x => Number(x.id) === Number(this.editDvModal.deliveryId));
      if (i < 0) return;

      const newStatus = this.edvForm.status || 'delivered';
      const remarks = (this.edvForm.remarks || '').trim();

      // Wajib isi keterangan kalau status reject/cancel
      if ((newStatus === 'rejected' || newStatus === 'cancelled') && !remarks) {
        this.toastMsg('Keterangan wajib diisi untuk status Rejected / Cancelled','error'); return;
      }

      // Cek SJ duplikat (kalau diisi dan berbeda dengan yang sekarang)
      const sjNo = (this.edvForm.sj_no || '').trim();
      if (sjNo) {
        const dupe = dList.find(d => Number(d.id) !== Number(this.editDvModal.deliveryId)
                                  && (d.sj_no||'').toLowerCase() === sjNo.toLowerCase());
        if (dupe) { this.toastMsg('No SJ sudah dipakai.','error'); return; }
      }

      const orderId = dList[i].order_id;
      dList[i] = {
        ...dList[i],
        status: newStatus,
        remarks: remarks,
        sj_no: sjNo || null,
        truck_no: this.edvForm.truck_no,
        qty: +this.edvForm.qty,
        driver_name: this.edvForm.driver_name,
        updated_at: new Date().toISOString(),
      };
      DB.set('deliveries', dList);

      this.recalcOrderStatus(orderId);
      this.reload();
      this.editDvModal.show = false;
      this.toastMsg('Pengiriman diupdate — Status: ' + newStatus);
    },

    deleteDelivery() {
      if (!confirm('Hapus permanen pengiriman ini?')) return;
      const dList = DB.get('deliveries');
      const d = dList.find(x => Number(x.id) === Number(this.editDvModal.deliveryId));
      if (!d) return;
      const orderId = d.order_id;
      DB.set('deliveries', dList.filter(x => Number(x.id) !== Number(this.editDvModal.deliveryId)));
      this.recalcOrderStatus(orderId);
      this.reload();
      this.editDvModal.show = false;
      this.toastMsg('Pengiriman dihapus');
    },

    downloadAfterDeliveryExcel() {
      const rows = this.filteredDeliveries;
      if (rows.length === 0) { this.toastMsg('Tidak ada data untuk di-download','error'); return; }
      let html = '<html><head><meta charset="UTF-8"></head><body>';
      html += '<h3>After Delivery Report</h3>';
      html += '<table border="1" cellpadding="4" cellspacing="0"><thead><tr>';
      const cols = ['Tgl Kirim','No SJ','Status','Order No','Site No','Project','Sales','Mutu','Plant','Truck No','Qty (m³)','Driver','Remarks'];
      cols.forEach(c => html += `<th style="background:#f0f0f0">${c}</th>`);
      html += '</tr></thead><tbody>';
      rows.forEach(d => {
        const o = this.orderById(d.order_id) || {};
        html += '<tr>';
        html += `<td>${d.delivery_date||''}</td>`;
        html += `<td>${d.sj_no||''}</td>`;
        html += `<td>${d.status || 'delivered'}</td>`;
        html += `<td>${o.order_no||''}</td>`;
        html += `<td>${o.site_no||''}</td>`;
        html += `<td>${o.project_name||''}</td>`;
        html += `<td>${this.salesName(o.sales_id)}</td>`;
        html += `<td>${this.mutuCode(o.mutu_id)}</td>`;
        html += `<td>${this.plantName(o.plant_id)}</td>`;
        html += `<td>${d.truck_no||''}</td>`;
        html += `<td>${d.qty||0}</td>`;
        html += `<td>${d.driver_name||''}</td>`;
        html += `<td>${d.remarks||''}</td>`;
        html += '</tr>';
      });
      html += '</tbody></table></body></html>';
      const blob = new Blob(['\ufeff' + html], {type: 'application/vnd.ms-excel;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `AfterDelivery_${todayISO()}.xls`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      this.toastMsg('File Excel di-download');
    },

    openEditOrder(o) {
      this.editOrderModal = { show:true, data:o };
      this.eoForm = { mutu_id:o.mutu_id, plant_id:o.plant_id, delivery_date:o.delivery_date,
                      pouring_time:o.pouring_time, qty_order:o.qty_order, metode_cor:o.metode_cor, status:o.status };
    },
    saveEditOrder() {
      const o = this.editOrderModal.data;
      const list = DB.get('orders');
      const i = list.findIndex(x => Number(x.id) === Number(o.id));
      if (i < 0) return;
      const qty = Number(this.eoForm.qty_order);
      const del = Number(list[i].qty_delivery) || 0;
      const remain = qty - del;
      let status = this.eoForm.status;
      if (list[i].status === 'cancelled') {
        status = 'cancelled';
      } else {
        status = del <= 0 ? 'scheduled' : (remain <= 0 ? 'completed' : 'partial');
      }
      list[i] = { ...list[i], mutu_id: Number(this.eoForm.mutu_id), plant_id: Number(this.eoForm.plant_id),
                  delivery_date: this.eoForm.delivery_date, pouring_time: this.eoForm.pouring_time,
                  qty_order: qty, qty_remain: remain, metode_cor: this.eoForm.metode_cor, status };
      DB.set('orders', list);
      this.reload();
      this.editOrderModal.show = false;
      this.toastMsg('Order diupdate');
    },

    cancelOrderFromEdit() {
      const o = this.editOrderModal.data;
      const reason = prompt('Masukkan alasan CANCEL ORDER ' + o.order_no + ':');
      if (!reason || !reason.trim()) {
        this.toastMsg('Alasan cancel wajib diisi','error'); return;
      }
      const list = DB.get('orders');
      const i = list.findIndex(x => Number(x.id) === Number(o.id));
      if (i < 0) return;
      list[i] = { ...list[i], status: 'cancelled', cancel_reason: reason.trim(), cancelled_at: new Date().toISOString(), cancelled_by: this.currentUser?.id };
      DB.set('orders', list);
      this.reload();
      this.editOrderModal.show = false;
      this.toastMsg('Order ' + o.order_no + ' dibatalkan');
    },

    cancelOrderFromSearch(o) {
      if (this.hasDelivery(o.id)) {
        this.toastMsg('Tidak bisa cancel — sudah ada pengiriman','error'); return;
      }
      const reason = prompt('Masukkan alasan CANCEL ORDER ' + o.order_no + ':');
      if (!reason || !reason.trim()) {
        this.toastMsg('Alasan cancel wajib diisi','error'); return;
      }
      const list = DB.get('orders');
      const i = list.findIndex(x => Number(x.id) === Number(o.id));
      if (i < 0) return;
      list[i] = { ...list[i], status: 'cancelled', cancel_reason: reason.trim(), cancelled_at: new Date().toISOString(), cancelled_by: this.currentUser?.id };
      DB.set('orders', list);
      this.reload();
      this.toastMsg('Order ' + o.order_no + ' dibatalkan');
    },

    openOrderDetail(o) { this.orderDetailModal = { show:true, data:o }; },
    get orderDetailDeliveries() {
      if (!this.orderDetailModal.data) return [];
      return this.deliveries.filter(d => Number(d.order_id) === Number(this.orderDetailModal.data.id)).sort((a,b) => b.id - a.id);
    },
    openEditOrderFromDetail() {
      const o = this.orderDetailModal.data;
      this.orderDetailModal.show = false;
      this.openEditOrder(o);
    },

    get filteredOrders() {
      const u = this.currentUser;
      if (!u) return [];
      let list = this.orders.slice();
      if (u.role === 'sales') list = list.filter(o=>Number(o.sales_id)===Number(u.id));
      if (this.sFilter.q) {
        const q = this.sFilter.q.toLowerCase();
        list = list.filter(o=>o.order_no.toLowerCase().includes(q) || o.site_no.toLowerCase().includes(q) || o.project_name.toLowerCase().includes(q));
      }
      if (this.sFilter.plant_id) list = list.filter(o=>Number(o.plant_id)===Number(this.sFilter.plant_id));
      if (this.sFilter.mutu_id) list = list.filter(o=>Number(o.mutu_id)===Number(this.sFilter.mutu_id));
      if (this.sFilter.status) list = list.filter(o=>o.status===this.sFilter.status);
      return list.sort((a,b)=>b.id-a.id);
    },

    get filteredDeliveries() {
      const u = this.currentUser;
      if (!u) return [];
      let list = this.deliveries.slice();
      if (u.role === 'sales') {
        const myOrders = this.orders.filter(o=>Number(o.sales_id)===Number(u.id)).map(o=>Number(o.id));
        list = list.filter(d=>myOrders.includes(Number(d.order_id)));
      }
      if (this.adFilter.q) {
        const q = this.adFilter.q.toLowerCase();
        list = list.filter(d=>{
          const o = this.orderById(d.order_id)||{};
          return (o.site_no||'').toLowerCase().includes(q) || (o.project_name||'').toLowerCase().includes(q) || (d.sj_no||'').toLowerCase().includes(q);
        });
      }
      if (this.adFilter.status) {
        list = list.filter(d => (d.status || 'delivered') === this.adFilter.status);
      }
      if (this.adFilter.date_from) list = list.filter(d=>d.delivery_date>=this.adFilter.date_from);
      if (this.adFilter.date_to) list = list.filter(d=>d.delivery_date<=this.adFilter.date_to);
      return list.sort((a,b)=>b.id-a.id);
    },

    get pendingProposals() { return this.prospects.filter(p=>p.site_no_status==='propose_site_no' && p.source !== 'customer_repeat'); },
    openPropose(p) { this.propModal = { show:true, data:p }; this.propForm = { site_no:'', po_no:'', mutu:[] }; },
    savePropose() {
      if (!this.propForm.site_no || !this.propForm.po_no || this.propForm.mutu.length===0) {
        this.toastMsg('Lengkapi Site No, PO No, Mutu','error'); return;
      }
      const p = this.propModal.data;
      const prList = DB.get('propose');
      prList.push({
        id: DB.nextId('propose'), prospect_id: p.id, project_name: p.project_name,
        address: p.address, pic_project: p.pic_name, pic_contact: p.pic_contact,
        sales_visit_id: p.sales_visit_id, site_no: this.propForm.site_no, po_no: this.propForm.po_no,
        mutu: this.propForm.mutu.map(Number), status: 'complete', created_by: this.currentUser?.id,
        created_at: new Date().toISOString(),
      });
      DB.set('propose', prList);
      const ps = DB.get('prospects');
      const pi = ps.findIndex(x=>Number(x.id)===Number(p.id));
      if (pi>=0) {
        ps[pi].site_no = this.propForm.site_no;
        ps[pi].po_no = this.propForm.po_no;
        ps[pi].site_no_status = 'complete';
        ps[pi].site_no_completed_at = new Date().toISOString();
      }
      DB.set('prospects', ps);
      this.reload();
      this.propModal.show = false;
      this.toastMsg('Site No ' + this.propForm.site_no + ' dirilis');
    },

    openEditUser(u) {
      this.editUserModal = { show:true, userId: u.id };
      this.euForm = {
        username: u.username||'', name: u.name||'', email: u.email||'',
        password: u.password||'', role: u.role||'sales',
        plant_id: u.plant_id||'',
        assigned_sites: Array.isArray(u.assigned_sites) ? [...u.assigned_sites] : [],
        is_active: u.is_active !== false, avatar: u.avatar||null,
      };
      this.showEditUserPw = false;
    },
    saveEditUser() {
      const uid = (this.euForm.username || '').trim().toLowerCase();
      if (!uid || !/^[a-z0-9_.\-]+$/.test(uid)) { this.toastMsg('User ID tidak valid','error'); return; }
      if (!this.euForm.name.trim()) { this.toastMsg('Nama wajib diisi','error'); return; }
      if ((this.euForm.password||'').length < 6) { this.toastMsg('Password minimal 6 karakter','error'); return; }
      const list = DB.get('users');
      const i = list.findIndex(x => Number(x.id) === Number(this.editUserModal.userId));
      if (i < 0) return;
      if (list.find(x => Number(x.id) !== Number(this.editUserModal.userId) && (x.username||'').toLowerCase() === uid)) {
        this.toastMsg('User ID sudah dipakai','error'); return;
      }
      const mail = (this.euForm.email||'').trim().toLowerCase();
      if (mail && list.find(x => Number(x.id) !== Number(this.editUserModal.userId) && (x.email||'').toLowerCase() === mail)) {
        this.toastMsg('Email sudah dipakai','error'); return;
      }
      if (Number(this.editUserModal.userId) === Number(this.currentUser.id) && !this.euForm.is_active) {
        this.toastMsg('Tidak bisa nonaktifkan akun sendiri','error'); return;
      }
      list[i] = {
        ...list[i], username: uid, name: this.euForm.name, email: mail,
        password: this.euForm.password, role: this.euForm.role,
        plant_id: this.euForm.plant_id ? Number(this.euForm.plant_id) : null,
        assigned_sites: this.euForm.role === 'customer' ? (this.euForm.assigned_sites || []) : [],
        is_active: this.euForm.is_active,
      };
      DB.set('users', list);
      if (Number(this.editUserModal.userId) === Number(this.currentUser.id)) {
        this.currentUser = list[i];
        localStorage.setItem('beton_current', JSON.stringify(list[i]));
      }
      this.reload();
      this.editUserModal.show = false;
      this.toastMsg('User diupdate');
    },

    openEditPlant(p) { this.editPlantModal = { show:true, id: p.id }; this.epForm = { code:p.code||'', name:p.name||'', address:p.address||'', phone:p.phone||'' }; },
    saveEditPlant() {
      const list = DB.get('plants');
      const i = list.findIndex(x => Number(x.id) === Number(this.editPlantModal.id));
      if (i < 0) return;
      list[i] = { ...list[i], ...this.epForm };
      DB.set('plants', list);
      this.reload();
      this.editPlantModal.show = false;
      this.toastMsg('Plant diupdate');
    },
    openEditMutu(m) { this.editMutuModal = { show:true, id: m.id }; this.emForm = { code:m.code||'', name:m.name||'', slump:m.slump||'', price:m.price||0 }; },
    saveEditMutu() {
      const list = DB.get('mutu');
      const i = list.findIndex(x => Number(x.id) === Number(this.editMutuModal.id));
      if (i < 0) return;
      list[i] = { ...list[i], ...this.emForm };
      DB.set('mutu', list);
      this.reload();
      this.editMutuModal.show = false;
      this.toastMsg('Mutu diupdate');
    },
    openEditCompetitor(c) { this.editKompetitorModal = { show:true, id: c.id }; this.ecForm = { name:c.name||'', address:c.address||'', contact_person:c.contact_person||'', phone:c.phone||'' }; },
    saveEditKompetitor() {
      const list = DB.get('competitors');
      const i = list.findIndex(x => Number(x.id) === Number(this.editKompetitorModal.id));
      if (i < 0) return;
      list[i] = { ...list[i], ...this.ecForm };
      DB.set('competitors', list);
      this.reload();
      this.editKompetitorModal.show = false;
      this.toastMsg('Kompetitor diupdate');
    },
    openEditAddress(a) { this.editAlamatModal = { show:true, id: a.id }; this.eaForm = { label:a.label||'', address:a.address||'', city:a.city||'', province:a.province||'', type:a.type||'site' }; },
    saveEditAddress() {
      const list = DB.get('addresses');
      const i = list.findIndex(x => Number(x.id) === Number(this.editAlamatModal.id));
      if (i < 0) return;
      list[i] = { ...list[i], ...this.eaForm };
      DB.set('addresses', list);
      this.reload();
      this.editAlamatModal.show = false;
      this.toastMsg('Alamat diupdate');
    },

    addUser() {
      const list = DB.get('users');
      const uid = (this.uForm.username || '').trim().toLowerCase();
      const mail = (this.uForm.email || '').trim().toLowerCase();
      if (!uid || !/^[a-z0-9_.\-]+$/.test(uid)) { this.toastMsg('User ID tidak valid','error'); return; }
      if (list.find(u => (u.username||'').toLowerCase() === uid)) { this.toastMsg('User ID sudah dipakai','error'); return; }
      if (mail && list.find(u => (u.email||'').toLowerCase() === mail)) { this.toastMsg('Email sudah dipakai','error'); return; }
      list.push({
        id: DB.nextId('users'), username: uid, name: this.uForm.name, email: mail,
        password: this.uForm.password, role: this.uForm.role,
        plant_id: this.uForm.plant_id ? Number(this.uForm.plant_id) : null,
        assigned_sites: this.uForm.role === 'customer' ? (this.uForm.assigned_sites || []) : [],
        is_active: true,
      });
      DB.set('users', list);
      this.uForm = { username:'', name:'',email:'',password:'',role:'',plant_id:'',assigned_sites:[] };
      this.reload();
      this.toastMsg('User "' + uid + '" ditambahkan');
    },
    delUser(id) { DB.set('users', DB.get('users').filter(u=>Number(u.id)!==Number(id))); this.reload(); },
    addPlant() { const list = DB.get('plants'); list.push({ id: DB.nextId('plants'), ...this.plForm, is_active:1 }); DB.set('plants', list); this.plForm={ code:'',name:'',address:'',phone:'' }; this.reload(); this.toastMsg('Plant ditambahkan'); },
    addMutu() { const list = DB.get('mutu'); list.push({ id: DB.nextId('mutu'), ...this.mForm, is_active:1 }); DB.set('mutu', list); this.mForm={ code:'',name:'',slump:'',price:0 }; this.reload(); this.toastMsg('Mutu ditambahkan'); },
    addCompetitor() { const list = DB.get('competitors'); list.push({ id: DB.nextId('competitors'), ...this.cForm }); DB.set('competitors', list); this.cForm={ name:'',address:'',contact_person:'',phone:'' }; this.reload(); this.toastMsg('Kompetitor ditambahkan'); },
    addAddress() { const list = DB.get('addresses'); list.push({ id: DB.nextId('addresses'), ...this.aForm }); DB.set('addresses', list); this.aForm={ label:'',address:'',city:'',province:'',type:'site' }; this.reload(); this.toastMsg('Alamat ditambahkan'); },
    delItem(table, id) { if (!confirm('Hapus item ini?')) return; DB.set(table, DB.get(table).filter(x=>Number(x.id)!==Number(id))); this.reload(); },
  };
}
</script>
